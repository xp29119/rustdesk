name: Managed authentication checks
on:
  workflow_dispatch:
  push:
    branches: [codex/internal-client-1.5.0]
    paths:
      - libs/managed_auth/**
      - control-platform/**
      - .github/workflows/managed-auth-checks.yml
permissions:
  contents: read
concurrency:
  group: managed-auth-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.99.1"
      - run: cargo test --locked --manifest-path libs/managed_auth/Cargo.toml
  control-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
        working-directory: control-platform
      - run: python -m pytest -q
        working-directory: control-platform
