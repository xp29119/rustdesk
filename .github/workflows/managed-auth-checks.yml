name: Managed authentication checks
on:
  workflow_dispatch:
  push:
    branches: [codex/internal-client-1.5.0]
    paths:
      - libs/managed_auth/**
      - control-platform/**
      - .github/workflows/managed-auth-checks.yml
permissions:
  contents: read
concurrency:
  group: managed-auth-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certificate-network-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read-only connectivity probe (no login or server changes)
        shell: python
        run: |
          import json, socket, urllib.request
          with urllib.request.urlopen("https://acme-v02.api.letsencrypt.org/directory", timeout=15) as response:
              directory = json.load(response)
          print("ACME reachable; short-lived profile:", "shortlived" in directory.get("meta", {}).get("profiles", {}))
          with socket.create_connection(("8.138.230.183", 22), timeout=12) as connection:
              connection.settimeout(5)
              banner = connection.recv(128)
          if not banner.startswith(b"SSH-2.0-"):
              raise RuntimeError("Unexpected server protocol")
          print("Domestic server SSH reachable from GitHub runner; authentication was not attempted.")
  client-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.99.1"
      - run: cargo test --locked --manifest-path libs/managed_auth/Cargo.toml
  control-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
        working-directory: control-platform
      - run: python -m pytest -q
        working-directory: control-platform
